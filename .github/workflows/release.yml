name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # lets GITHUB_TOKEN create the release and upload assets

jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}   # see https://game.ci docs for activation
          UNITY_EMAIL:   ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          versioning: Semantic        # sets the Unity bundle version from your git tag

      - name: Zip build contents        # zip the CONTENTS so the exe sits at the zip root
        run: |
          cd build/StandaloneWindows64
          zip -r "$GITHUB_WORKSPACE/MyGame-windows.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          files: MyGame-windows.zip

  launcher:
    needs: game
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: dotnet publish Launcher -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none

      - name: Zip launcher
        run: Compress-Archive -Path Launcher/bin/Release/net8.0-windows/win-x64/publish/Launcher.exe -DestinationPath Launcher.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: Launcher.zip